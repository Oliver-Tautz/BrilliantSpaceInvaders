name: Build and deploy Web game

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    name: Build Unity WebGL
    runs-on: ubuntu-latest

    environment:
      name: build

    steps:
      - name: Check out project
        uses: actions/checkout@v4

      - name: Restore Unity Library cache
        id: unity-cache
        uses: actions/cache/restore@v4
        with:
          path: Library
          key: Library-WebGL-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-WebGL-

      - name: Check Unity license secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        shell: bash
        run: |
          set -euo pipefail

          if [[ -z "$UNITY_LICENSE" || -z "$UNITY_EMAIL" || -z "$UNITY_PASSWORD" ]]; then
            echo "::error::Set UNITY_LICENSE, UNITY_EMAIL, and UNITY_PASSWORD in the 'build' GitHub environment."
            exit 1
          fi

      - name: Build Unity Web player
        uses: game-ci/unity-builder@v4
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: WebGL
          buildProfile: Assets/Settings/Build Profiles/Web - Desktop - Release.asset

      - name: Save Unity Library cache
        if: always() && steps.unity-cache.outputs.cache-hit != 'true'
        continue-on-error: true
        uses: actions/cache/save@v4
        with:
          path: Library
          key: ${{ steps.unity-cache.outputs.cache-primary-key }}

      - name: Prepare GitHub Pages files
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t index_files < <(
            find build/WebGL -type f -name index.html
          )

          if [[ ${#index_files[@]} -ne 1 ]]; then
            echo "::error::Expected exactly one WebGL index.html under build/WebGL."
            echo "Found: ${#index_files[@]}"
            printf '%s\n' "${index_files[@]}"
            exit 1
          fi

          rm -rf public
          mkdir -p public

          cp -a "$(dirname "${index_files[0]}")"/. public/

          touch public/.nojekyll

          if [[ -d public/Build ]] && \
             [[ -n "$(find public/Build -type f \( -name '*.br' -o -name '*.gz' \) -print -quit)" ]]; then
            echo "::error::Unity emitted compressed .br/.gz files."
            echo "::error::GitHub Pages cannot provide the required Content-Encoding headers."
            echo "::error::Enable decompression fallback or disable compression in the Unity WebGL build profile."
            exit 1
          fi

      - name: Show generated files
        shell: bash
        run: |
          find public -maxdepth 3 -type f | sort

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: public

  deploy:
    name: Deploy GitHub Pages
    runs-on: ubuntu-latest
    needs: build

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
